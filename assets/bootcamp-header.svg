<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200"
     role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Bootcamp C# Zero to Hero</title>
  <desc id="bdesc">Banner: Bootcamp C# Zero to Hero — 26 semanas, 260 horas, .NET 10, C# 14, del lenguaje a producción</desc>
  <rect width="800" height="200" fill="#0d1117"/>
  <rect x="0" y="0" width="4" height="200" fill="#512BD4"/>
  <polygon points="200,15 273.6,57.5 273.6,142.5 200,185 126.4,142.5 126.4,57.5"
           fill="#512BD4" fill-opacity="0.06" stroke="#512BD4" stroke-width="1.5" stroke-opacity="0.15"/>
  <text x="28" y="44" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#484f58">BOOTCAMP</text>
  <text x="28" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="58" font-weight="700">
    <tspan fill="#f0f6fc">C</tspan><tspan fill="#7a5cf0">#</tspan><tspan fill="#f0f6fc" font-size="34" dx="14">.NET 10</tspan>
  </text>
  <text x="28" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#8b949e">Zero to Hero</text>
  <text x="28" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#484f58">Del lenguaje a producción: internals · concurrencia · ASP.NET Core · gRPC · Blazor · MAUI</text>
  <g font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">
    <rect x="560" y="40" width="210" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="665" y="62" text-anchor="middle" fill="#f0f6fc">26 semanas · 260 horas</text>
    <rect x="560" y="84" width="210" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="665" y="106" text-anchor="middle" fill="#f0f6fc">10 h / semana</text>
    <rect x="560" y="128" width="210" height="34" rx="6" fill="#3f21a6" stroke="#512BD4"/>
    <text x="665" y="150" text-anchor="middle" fill="#f0f6fc">C# 14 · .NET 10 LTS</text>
  </g>
</svg>
