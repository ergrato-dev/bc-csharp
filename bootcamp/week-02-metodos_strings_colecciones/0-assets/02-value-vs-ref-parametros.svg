<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Paso por valor vs ref: qué se copia</title>
  <desc id="desc">Tres escenarios en columnas. Primero, int por valor: el llamador tiene count igual a 1 en el stack y el método recibe una copia n; incrementar n no afecta a count. Segundo, List por valor: el llamador tiene una variable list con una referencia a un objeto en el heap; el método recibe una copia de la referencia xs que apunta al mismo objeto; xs.Add modifica el objeto compartido, pero xs igual a una lista nueva solo cambia la copia. Tercero, ref int: el método recibe un puntero gestionado a la variable count del llamador; a igual a 2 cambia count.</desc>
  <rect width="800" height="480" rx="12" fill="#0d1117"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Todo se pasa por valor: la pregunta es qué se copia</text>

  <!-- columna 1: int -->
  <g font-size="12">
    <rect x="24" y="60" width="240" height="400" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="84" text-anchor="middle" font-weight="700" fill="#3fb950">int por valor</text>
    <text x="144" y="104" text-anchor="middle" font-family="ui-monospace,monospace" fill="#8b949e">Increment(count)</text>
    <text x="40" y="136" fill="#8b949e">stack del llamador</text>
    <rect x="40" y="144" width="100" height="40" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="90" y="169" text-anchor="middle" fill="#f0f6fc">count = 1</text>
    <text x="40" y="226" fill="#8b949e">frame de Increment</text>
    <rect x="40" y="234" width="100" height="40" rx="6" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="90" y="259" text-anchor="middle" fill="#f0f6fc">n = 1 → 2</text>
    <line x1="90" y1="184" x2="90" y2="226" stroke="#7a5cf0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="160" y="209" fill="#8b949e">copia 4 bytes</text>
    <text x="40" y="320" fill="#f0f6fc">count sigue = 1</text>
    <text x="40" y="340" fill="#8b949e">Dos variables distintas.</text>
    <text x="40" y="358" fill="#8b949e">Nada del llamador cambia.</text>
  </g>

  <!-- columna 2: List -->
  <g font-size="12">
    <rect x="280" y="60" width="240" height="400" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="400" y="84" text-anchor="middle" font-weight="700" fill="#d29922">List&lt;T&gt; por valor</text>
    <text x="400" y="104" text-anchor="middle" font-family="ui-monospace,monospace" fill="#8b949e">Append(list) · Replace(list)</text>
    <text x="296" y="136" fill="#8b949e">stack</text>
    <rect x="296" y="144" width="100" height="40" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="346" y="169" text-anchor="middle" fill="#f0f6fc">list = 0x1A</text>
    <rect x="296" y="234" width="100" height="40" rx="6" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="346" y="259" text-anchor="middle" fill="#f0f6fc">xs = 0x1A</text>
    <line x1="346" y1="184" x2="346" y2="226" stroke="#7a5cf0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="404" y="209" fill="#8b949e">copia la ref</text>
    <text x="440" y="136" fill="#8b949e">heap</text>
    <rect x="420" y="144" width="88" height="130" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="164" text-anchor="middle" fill="#8b949e">0x1A</text>
    <text x="464" y="186" text-anchor="middle" fill="#f0f6fc">List&lt;int&gt;</text>
    <text x="464" y="206" text-anchor="middle" fill="#f0f6fc">[1]</text>
    <text x="464" y="226" text-anchor="middle" fill="#3fb950">→ [1, 99]</text>
    <line x1="396" y1="164" x2="418" y2="164" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="396" y1="254" x2="418" y2="254" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="296" y="320" fill="#f0f6fc">xs.Add(99): list ve [1, 99]</text>
    <text x="296" y="340" fill="#8b949e">mismo objeto compartido</text>
    <text x="296" y="372" fill="#f0f6fc">xs = []: list sigue en 0x1A</text>
    <text x="296" y="392" fill="#8b949e">solo la copia xs apunta a</text>
    <text x="296" y="410" fill="#8b949e">otro objeto</text>
  </g>

  <!-- columna 3: ref -->
  <g font-size="12">
    <rect x="536" y="60" width="240" height="400" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="656" y="84" text-anchor="middle" font-weight="700" fill="#58a6ff">ref / out / in</text>
    <text x="656" y="104" text-anchor="middle" font-family="ui-monospace,monospace" fill="#8b949e">Set(ref count)</text>
    <text x="552" y="136" fill="#8b949e">stack del llamador</text>
    <rect x="552" y="144" width="100" height="40" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="602" y="169" text-anchor="middle" fill="#f0f6fc">count = 1 → 2</text>
    <text x="552" y="226" fill="#8b949e">frame de Set</text>
    <rect x="552" y="234" width="100" height="40" rx="6" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="602" y="259" text-anchor="middle" fill="#f0f6fc">a = &amp;count</text>
    <line x1="602" y1="234" x2="602" y2="186" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="616" y="209" fill="#8b949e">managed ptr</text>
    <text x="552" y="320" fill="#f0f6fc">a = 2 cambia count</text>
    <text x="552" y="340" fill="#8b949e">ref: alias, ya inicializada</text>
    <text x="552" y="358" fill="#8b949e">out: el método debe asignar</text>
    <text x="552" y="376" fill="#8b949e">in: alias de solo lectura</text>
    <text x="552" y="408" fill="#484f58">En IL los tres son int&amp;;</text>
    <text x="552" y="426" fill="#484f58">la diferencia la verifica el compilador</text>
  </g>
</svg>
