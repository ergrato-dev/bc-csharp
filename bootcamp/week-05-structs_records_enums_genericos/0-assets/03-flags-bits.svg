<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,sans-serif">
  <title id="t">Un enum con Flags guarda varias opciones en los bits de un entero</title>
  <desc id="d">Arriba, la declaración de un enum Amenities marcado con Flags cuyos miembros son potencias de dos: None cero, Wifi uno, Breakfast dos, Parking cuatro y Gym ocho. En el centro, una fila de ocho casillas que representa los bits de un byte; para el valor Wifi combinado con Breakfast están encendidos los bits cero y uno, lo que da el número tres, y ToString imprime Wifi coma Breakfast. Debajo, las cuatro operaciones básicas: combinar con o lógico, comprobar con y lógico distinto de cero o con HasFlag, añadir con o lógico, y quitar con y lógico del complemento. Abajo, las reglas: valores potencia de dos, un miembro None en cero obligatorio, el atributo Flags necesario para que ToString liste los nombres, y el aviso de que un enum no valida nada porque cualquier número cabe, por lo que hay que validar con TryParse e IsDefined lo que venga de fuera.</desc>
  <rect width="840" height="430" rx="12" fill="#0d1117"/>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">[Flags]: un conjunto de opciones en un solo número</text>

  <rect x="24" y="52" width="340" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <g font-family="ui-monospace,monospace" font-size="11.5">
    <text x="44" y="76" fill="#d29922">[Flags]</text>
    <text x="44" y="94" fill="#c9d1d9">enum Amenities</text>
    <text x="44" y="112" fill="#c9d1d9">{</text>
    <text x="60" y="130" fill="#8b949e">None      = 0,</text>
    <text x="60" y="148" fill="#3fb950">Wifi      = 1 &lt;&lt; 0,   // 1</text>
    <text x="60" y="166" fill="#3fb950">Breakfast = 1 &lt;&lt; 1,   // 2</text>
    <text x="60" y="184" fill="#8b949e">Parking   = 1 &lt;&lt; 2,   // 4</text>
  </g>

  <rect x="380" y="52" width="436" height="150" rx="10" fill="#161b22" stroke="#7a5cf0"/>
  <text x="400" y="76" font-size="12.5" font-weight="700" fill="#7a5cf0">Amenities.Wifi | Amenities.Breakfast  →  3</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="400" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="422" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="450" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="472" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="500" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="522" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="550" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="572" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="600" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="622" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="650" y="92" width="44" height="40" rx="4" fill="#21262d" stroke="#6e7681"/><text x="672" y="118" text-anchor="middle" fill="#484f58">0</text>
    <rect x="700" y="92" width="44" height="40" rx="4" fill="#3f21a6" stroke="#7a5cf0"/><text x="722" y="118" text-anchor="middle" fill="#f0f6fc">1</text>
    <rect x="750" y="92" width="44" height="40" rx="4" fill="#3f21a6" stroke="#7a5cf0"/><text x="772" y="118" text-anchor="middle" fill="#f0f6fc">1</text>
  </g>
  <text x="722" y="150" text-anchor="middle" font-size="10.5" fill="#3fb950">Breakfast</text>
  <text x="772" y="150" text-anchor="middle" font-size="10.5" fill="#3fb950">Wifi</text>
  <text x="400" y="176" font-size="11.5" fill="#8b949e">Cada opción ocupa UN bit: caben 32 en un int.</text>
  <text x="400" y="194" font-family="ui-monospace,monospace" font-size="11.5" fill="#c9d1d9">room.ToString() == "Wifi, Breakfast"</text>

  <rect x="24" y="218" width="792" height="112" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="242" font-size="13" font-weight="700" fill="#58a6ff">Las cuatro operaciones</text>
  <g font-family="ui-monospace,monospace" font-size="11.5">
    <text x="44" y="268" fill="#c9d1d9">combinar   var room = Wifi | Breakfast;</text>
    <text x="440" y="268" fill="#c9d1d9">añadir     room |= Gym;</text>
    <text x="44" y="292" fill="#c9d1d9">comprobar  (room &amp; Wifi) != 0   ·   room.HasFlag(Wifi)</text>
    <text x="440" y="292" fill="#c9d1d9">quitar     room &amp;= ~Wifi;</text>
  </g>
  <text x="44" y="318" font-size="11" fill="#484f58">HasFlag ya no boxea en .NET moderno; la máscara explícita se sigue usando en código caliente.</text>

  <rect x="24" y="346" width="792" height="66" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="44" y="370" font-size="12" fill="#8b949e">Reglas: potencias de dos · <tspan font-family="ui-monospace,monospace" fill="#c9d1d9">None = 0</tspan> obligatorio · sin <tspan font-family="ui-monospace,monospace" fill="#c9d1d9">[Flags]</tspan>, ToString imprime el número suelto.</text>
  <text x="44" y="396" font-size="12" fill="#d29922">⚠ Un enum no valida nada: <tspan font-family="ui-monospace,monospace">(Amenities)99</tspan> compila y se ejecuta. Valida lo externo con TryParse + IsDefined.</text>
</svg>
