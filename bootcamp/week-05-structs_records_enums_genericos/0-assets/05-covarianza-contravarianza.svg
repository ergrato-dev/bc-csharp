<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,sans-serif">
  <title id="t">Covarianza y contravarianza: hacia dónde fluyen los datos</title>
  <desc id="d">Tres paneles. El primero, covarianza con la palabra out: la T solo sale de la interfaz, como en IEnumerable de T, así que una secuencia de string vale donde se pide una secuencia de object, porque todo lo que salga será string y un string es un object. El segundo, contravarianza con la palabra in: la T solo entra, como en IComparer de T o Action de T, así que un comparador de object vale donde se pide un comparador de string, porque quien sabe tratar cualquier object sabe tratar strings. El tercero, invarianza: la T entra y sale, como en List de T, y por eso una lista de string no puede usarse como lista de object, ya que alguien podría insertar un entero. Abajo, los límites: la varianza solo existe en interfaces y delegados genéricos, solo con argumentos de tipo por referencia, y la conversión no genera código porque es la misma referencia reinterpretada. También se advierte de que los arrays son covariantes por herencia histórica y eso sí puede fallar en ejecución con ArrayTypeMismatchException.</desc>
  <rect width="840" height="440" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="c1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/></marker>
    <marker id="c2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/></marker>
  </defs>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">¿Caja&lt;string&gt; sirve donde se pide Caja&lt;object&gt;? Depende de por dónde fluye T</text>

  <rect x="24" y="56" width="256" height="228" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="152" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3fb950">out · covarianza</text>
  <text x="152" y="102" text-anchor="middle" font-size="11.5" fill="#8b949e">la T solo SALE</text>
  <text x="44" y="128" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">interface IEnumerable&lt;out T&gt;</text>
  <text x="44" y="146" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">{ T Current { get; } }</text>
  <line x1="60" y1="170" x2="244" y2="170" stroke="#3fb950" stroke-width="2" marker-end="url(#c1)"/>
  <text x="152" y="190" text-anchor="middle" font-size="11" fill="#8b949e">del contenedor hacia ti</text>
  <text x="44" y="216" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc">IEnumerable&lt;string&gt; s = ...;</text>
  <text x="44" y="234" font-family="ui-monospace,monospace" font-size="11" fill="#3fb950">IEnumerable&lt;object&gt; o = s;  ✔</text>
  <text x="44" y="262" font-size="11" fill="#484f58">Todo lo que salga será string,</text>
  <text x="44" y="278" font-size="11" fill="#484f58">y un string ES un object.</text>

  <rect x="292" y="56" width="256" height="228" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="420" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">in · contravarianza</text>
  <text x="420" y="102" text-anchor="middle" font-size="11.5" fill="#8b949e">la T solo ENTRA</text>
  <text x="312" y="128" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">interface IComparer&lt;in T&gt;</text>
  <text x="312" y="146" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">{ int Compare(T a, T b); }</text>
  <line x1="512" y1="170" x2="328" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#c2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#8b949e">de ti hacia el contenedor</text>
  <text x="312" y="216" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc">IComparer&lt;object&gt; any = ...;</text>
  <text x="312" y="234" font-family="ui-monospace,monospace" font-size="11" fill="#58a6ff">IComparer&lt;string&gt; s = any;  ✔</text>
  <text x="312" y="262" font-size="11" fill="#484f58">Quien sabe comparar cualquier</text>
  <text x="312" y="278" font-size="11" fill="#484f58">object sabe comparar strings.</text>

  <rect x="560" y="56" width="256" height="228" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="688" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">sin marca · invarianza</text>
  <text x="688" y="102" text-anchor="middle" font-size="11.5" fill="#8b949e">la T entra Y sale</text>
  <text x="580" y="128" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">class List&lt;T&gt;</text>
  <text x="580" y="146" font-family="ui-monospace,monospace" font-size="11" fill="#c9d1d9">{ T this[int i] { get; set; } }</text>
  <text x="688" y="176" text-anchor="middle" font-size="11" fill="#8b949e">en ambos sentidos</text>
  <text x="580" y="216" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc">List&lt;string&gt; s = ...;</text>
  <text x="580" y="234" font-family="ui-monospace,monospace" font-size="11" fill="#f85149">List&lt;object&gt; o = s;  ✘</text>
  <text x="580" y="262" font-size="11" fill="#484f58">Si compilara, alguien metería</text>
  <text x="580" y="278" font-size="11" fill="#484f58">un int en tu lista de strings.</text>

  <rect x="24" y="300" width="792" height="60" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="44" y="324" font-size="12" fill="#d29922">⚠ Los arrays SÍ son covariantes, por herencia histórica, y es inseguro:</text>
  <text x="44" y="348" font-family="ui-monospace,monospace" font-size="11.5" fill="#c9d1d9">object[] items = new string[2];  items[0] = 42;  →  ArrayTypeMismatchException en EJECUCIÓN</text>

  <rect x="24" y="374" width="792" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="398" font-size="12" fill="#8b949e">Límites: solo interfaces y delegados genéricos · solo argumentos de tipo por REFERENCIA (nada de <tspan font-family="ui-monospace,monospace" fill="#c9d1d9">IEnumerable&lt;int&gt;</tspan> → <tspan font-family="ui-monospace,monospace" fill="#c9d1d9">IEnumerable&lt;object&gt;</tspan>)</text>
  <text x="44" y="416" font-size="11" fill="#484f58">La conversión no genera código: es la misma referencia reinterpretada, y el compilador verifica la coherencia (CS1961).</text>
</svg>
