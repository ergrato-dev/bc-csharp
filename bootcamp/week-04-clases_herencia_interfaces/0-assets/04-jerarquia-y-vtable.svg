<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,sans-serif">
  <title id="t">Jerarquía de tipos y tabla de métodos</title>
  <desc id="d">A la izquierda, la jerarquía: object en la raíz, debajo la clase abstracta Account con los miembros Owner, Balance, Deposit y el método abstracto MonthlyFee, y debajo dos clases selladas, SavingsAccount y CheckingAccount, que redefinen MonthlyFee. A la derecha, la tabla de métodos de SavingsAccount: hereda las entradas de object y de Account en el mismo orden y sustituye solo el slot de MonthlyFee por su propia implementación, añadiendo al final sus métodos nuevos. Debajo se explica que el objeto es un único bloque de memoria con el encabezado, los campos de la base y después los de la derivada, por lo que un upcast no copia nada y el puntero de tabla de métodos siempre apunta al tipo real.</desc>
  <rect width="840" height="450" rx="12" fill="#0d1117"/>
  <defs><marker id="m4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e7681"/></marker></defs>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Herencia: una jerarquía, una tabla de métodos por tipo</text>

  <rect x="24" y="56" width="380" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="214" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">Jerarquía</text>

  <rect x="144" y="94" width="140" height="34" rx="7" fill="#21262d" stroke="#6e7681"/>
  <text x="214" y="116" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#8b949e">object</text>
  <line x1="214" y1="128" x2="214" y2="148" stroke="#6e7681" stroke-width="2" marker-end="url(#m4)"/>

  <rect x="104" y="152" width="220" height="74" rx="7" fill="#3f21a6" stroke="#7a5cf0"/>
  <text x="214" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f0f6fc">abstract Account</text>
  <text x="214" y="194" text-anchor="middle" font-size="11" fill="#c9d1d9">Owner · Balance · Deposit()</text>
  <text x="214" y="214" text-anchor="middle" font-size="11" fill="#d29922">abstract MonthlyFee()</text>

  <line x1="214" y1="226" x2="214" y2="242" stroke="#6e7681" stroke-width="2"/>
  <line x1="114" y1="242" x2="314" y2="242" stroke="#6e7681" stroke-width="2"/>
  <line x1="114" y1="242" x2="114" y2="262" stroke="#6e7681" stroke-width="2" marker-end="url(#m4)"/>
  <line x1="314" y1="242" x2="314" y2="262" stroke="#6e7681" stroke-width="2" marker-end="url(#m4)"/>

  <rect x="44" y="266" width="142" height="62" rx="7" fill="#21262d" stroke="#3fb950"/>
  <text x="115" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">sealed Savings</text>
  <text x="115" y="308" text-anchor="middle" font-size="11" fill="#3fb950">override MonthlyFee</text>

  <rect x="242" y="266" width="142" height="62" rx="7" fill="#21262d" stroke="#3fb950"/>
  <text x="313" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">sealed Checking</text>
  <text x="313" y="308" text-anchor="middle" font-size="11" fill="#3fb950">override MonthlyFee</text>

  <rect x="426" y="56" width="390" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="621" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5cf0">Method table de SavingsAccount</text>
  <g font-family="ui-monospace,monospace" font-size="11.5">
    <rect x="450" y="96" width="342" height="30" rx="5" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="116" fill="#8b949e">slot 0  ToString()</text><text x="700" y="116" font-family="system-ui,sans-serif" font-size="10.5" fill="#484f58">de object</text>
    <rect x="450" y="130" width="342" height="30" rx="5" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="150" fill="#8b949e">slot 1  Equals(object)</text><text x="700" y="150" font-family="system-ui,sans-serif" font-size="10.5" fill="#484f58">de object</text>
    <rect x="450" y="164" width="342" height="30" rx="5" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="184" fill="#8b949e">slot 2  GetHashCode()</text><text x="700" y="184" font-family="system-ui,sans-serif" font-size="10.5" fill="#484f58">de object</text>
    <rect x="450" y="198" width="342" height="30" rx="5" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="218" fill="#c9d1d9">slot 3  Deposit()</text><text x="700" y="218" font-family="system-ui,sans-serif" font-size="10.5" fill="#484f58">de Account</text>
    <rect x="450" y="232" width="342" height="30" rx="5" fill="#3f21a6" stroke="#3fb950"/>
    <text x="464" y="252" fill="#f0f6fc">slot 4  MonthlyFee()</text><text x="672" y="252" font-family="system-ui,sans-serif" font-size="10.5" fill="#3fb950">→ Savings.MonthlyFee</text>
    <rect x="450" y="266" width="342" height="30" rx="5" fill="#21262d" stroke="#6e7681"/>
    <text x="464" y="286" fill="#c9d1d9">slot 5  ApplyInterest()</text><text x="700" y="286" font-family="system-ui,sans-serif" font-size="10.5" fill="#484f58">nuevo</text>
  </g>
  <text x="450" y="322" font-size="11" fill="#8b949e">Las entradas heredadas conservan el MISMO orden que en la base:</text>
  <text x="450" y="340" font-size="11" fill="#8b949e">por eso la llamada funciona igual vista como Account o como Savings.</text>

  <rect x="24" y="372" width="792" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="396" font-size="12" fill="#8b949e">El objeto es UN bloque: encabezado, campos de la base y después los de la derivada. Un upcast no copia nada, es la misma dirección con otro tipo estático.</text>
  <text x="44" y="418" font-size="12" fill="#8b949e">El puntero de method table del encabezado apunta siempre al tipo REAL: eso lee GetType() y con eso resuelve callvirt.</text>
</svg>
