<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,sans-serif">
  <title id="t">Una variable de clase guarda una referencia; el objeto vive en el heap</title>
  <desc id="d">A la izquierda, la pila con dos variables locales, x e y, que contienen la misma dirección. A la derecha, el heap gestionado con un único objeto Account, formado por un encabezado de dieciséis bytes en x64 (sync block index y puntero a la tabla de métodos) seguido de sus campos: Owner con una referencia a un string y balance con un valor decimal. Ambas variables apuntan al mismo objeto, por lo que y.Deposit cambia lo que ve x y ReferenceEquals devuelve true. Abajo se indica que asignar copia la referencia, no el objeto, y que el objeto lo libera el recolector de basura cuando ninguna referencia lo alcanza.</desc>
  <rect width="820" height="420" rx="12" fill="#0d1117"/>
  <defs><marker id="m1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Account x = new Account(); Account y = x;</text>

  <rect x="30" y="56" width="250" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="155" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">Pila (variables locales)</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="56" y="100" width="198" height="52" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="72" y="122" fill="#f0f6fc">x</text>
    <text x="110" y="122" fill="#8b949e">0x00A4F120</text>
    <text x="72" y="142" font-family="system-ui,sans-serif" font-size="11" fill="#484f58">referencia (8 bytes en x64)</text>

    <rect x="56" y="168" width="198" height="52" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="72" y="190" fill="#f0f6fc">y</text>
    <text x="110" y="190" fill="#8b949e">0x00A4F120</text>
    <text x="72" y="210" font-family="system-ui,sans-serif" font-size="11" fill="#484f58">la MISMA dirección</text>
  </g>
  <text x="56" y="250" font-size="11" fill="#8b949e">Account y = x; copia la referencia,</text>
  <text x="56" y="268" font-size="11" fill="#8b949e">nunca el objeto.</text>
  <text x="56" y="292" font-size="11" fill="#3fb950">ReferenceEquals(x, y) == true</text>

  <line x1="258" y1="126" x2="360" y2="150" stroke="#7a5cf0" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="258" y1="194" x2="360" y2="170" stroke="#7a5cf0" stroke-width="2" marker-end="url(#m1)"/>

  <rect x="370" y="56" width="420" height="250" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="580" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5cf0">Heap gestionado</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="392" y="100" width="376" height="36" rx="6" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="406" y="123" fill="#f0f6fc">sync block index</text>
    <text x="620" y="123" font-family="system-ui,sans-serif" font-size="11" fill="#c9d1d9">lock e identity hash</text>

    <rect x="392" y="140" width="376" height="36" rx="6" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="406" y="163" fill="#f0f6fc">method table ptr</text>
    <text x="620" y="163" font-family="system-ui,sans-serif" font-size="11" fill="#c9d1d9">lo que lee GetType()</text>

    <rect x="392" y="184" width="376" height="36" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="406" y="207" fill="#f0f6fc">Owner</text>
    <text x="620" y="207" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">referencia a un string</text>

    <rect x="392" y="224" width="376" height="36" rx="6" fill="#21262d" stroke="#6e7681"/>
    <text x="406" y="247" fill="#f0f6fc">_balance</text>
    <text x="620" y="247" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">decimal, inline en el objeto</text>
  </g>
  <text x="392" y="284" font-size="11" fill="#8b949e">Encabezado: 16 bytes en x64 · objeto mínimo: 24 bytes</text>

  <text x="410" y="342" text-anchor="middle" font-size="12" fill="#8b949e">new = reservar + poner todos los campos a cero + ejecutar el constructor. Por eso un campo sin inicializar vale 0 / null / false.</text>
  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#8b949e">No hay delete: cuando ninguna referencia alcanza al objeto, el GC lo recupera. Recursos externos → IDisposable + using.</text>
  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#484f58">Pasar el objeto a un método copia la referencia: mutarlo se ve fuera, reasignar el parámetro no.</text>
</svg>
