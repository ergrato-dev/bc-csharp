<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Del disco al objeto: capas de un stream</title>
  <desc id="desc">Cadena de lectura de izquierda a derecha: el fichero en disco entrega bytes al FileStream, que los acumula en un buffer de 4096 bytes para no hacer una syscall por byte; el FileStream los pasa a StreamReader, que decodifica UTF-8 a caracteres y ofrece ReadLine; de ahí el texto llega a JsonSerializer, que produce objetos del dominio. Debajo, la cadena de escritura en sentido inverso, con la advertencia de que sin Dispose o Flush quedan bytes en el buffer sin escribir. A la derecha, el patrón de escritura segura: escribir en un fichero temporal y renombrar con File.Move, que es atómico dentro del mismo volumen.</desc>
  <rect width="840" height="450" rx="12" fill="#0d1117"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Capas entre el disco y tus objetos</text>

  <!-- lectura -->
  <rect x="24" y="52" width="792" height="140" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="74" font-size="13" font-weight="700" fill="#3fb950">Lectura</text>
  <g font-size="12">
    <rect x="44" y="88" width="130" height="78" rx="8" fill="#21262d" stroke="#6e7681"/>
    <text x="109" y="112" text-anchor="middle" fill="#f0f6fc">catalog.json</text>
    <text x="109" y="132" text-anchor="middle" font-size="11" fill="#8b949e">bytes en disco</text>
    <text x="109" y="150" text-anchor="middle" font-size="11" fill="#484f58">UTF-8</text>

    <rect x="218" y="88" width="150" height="78" rx="8" fill="#21262d" stroke="#6e7681"/>
    <text x="293" y="110" text-anchor="middle" font-family="ui-monospace,monospace" fill="#f0f6fc">FileStream</text>
    <text x="293" y="130" text-anchor="middle" font-size="11" fill="#8b949e">buffer 4096 B</text>
    <text x="293" y="148" text-anchor="middle" font-size="11" fill="#484f58">1 syscall por buffer</text>

    <rect x="412" y="88" width="160" height="78" rx="8" fill="#21262d" stroke="#6e7681"/>
    <text x="492" y="110" text-anchor="middle" font-family="ui-monospace,monospace" fill="#f0f6fc">StreamReader</text>
    <text x="492" y="130" text-anchor="middle" font-size="11" fill="#8b949e">bytes → char (Decoder)</text>
    <text x="492" y="148" text-anchor="middle" font-size="11" fill="#484f58">ReadLine / ReadLineAsync</text>

    <rect x="616" y="88" width="180" height="78" rx="8" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="706" y="110" text-anchor="middle" font-family="ui-monospace,monospace" fill="#f0f6fc">JsonSerializer</text>
    <text x="706" y="130" text-anchor="middle" font-size="11" fill="#8b949e">texto → List&lt;Product&gt;</text>
    <text x="706" y="148" text-anchor="middle" font-size="11" fill="#3fb950">objetos del dominio</text>

    <line x1="176" y1="127" x2="214" y2="127" stroke="#7a5cf0" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="370" y1="127" x2="408" y2="127" stroke="#7a5cf0" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="574" y1="127" x2="612" y2="127" stroke="#7a5cf0" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- escritura -->
  <rect x="24" y="208" width="480" height="140" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="230" font-size="13" font-weight="700" fill="#d29922">Escritura (mismas capas, sentido inverso)</text>
  <g font-size="12">
    <rect x="44" y="244" width="130" height="66" rx="8" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="109" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">Serialize</text>
    <text x="109" y="290" text-anchor="middle" font-size="11" fill="#8b949e">objetos → texto</text>

    <rect x="212" y="244" width="130" height="66" rx="8" fill="#21262d" stroke="#6e7681"/>
    <text x="277" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">StreamWriter</text>
    <text x="277" y="290" text-anchor="middle" font-size="11" fill="#8b949e">char → bytes</text>

    <rect x="380" y="244" width="106" height="66" rx="8" fill="#21262d" stroke="#6e7681"/>
    <text x="433" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">FileStream</text>
    <text x="433" y="290" text-anchor="middle" font-size="11" fill="#8b949e">buffer → disco</text>

    <line x1="176" y1="277" x2="208" y2="277" stroke="#7a5cf0" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="344" y1="277" x2="376" y2="277" stroke="#7a5cf0" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="40" y="332" font-size="11" fill="#f85149">Sin Dispose (o Flush) el último buffer nunca llega al disco: todo stream vive dentro de un using.</text>

  <!-- escritura segura -->
  <rect x="520" y="208" width="296" height="140" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="536" y="230" font-size="13" font-weight="700" fill="#3fb950">Escritura segura</text>
  <g font-family="ui-monospace,monospace" font-size="11.5" fill="#f0f6fc">
    <text x="536" y="256">File.WriteAllText(path + ".tmp", json);</text>
    <text x="536" y="278">File.Move(path + ".tmp", path, true);</text>
  </g>
  <text x="536" y="302" font-size="11" fill="#8b949e">El rename es atómico dentro del volumen:</text>
  <text x="536" y="318" font-size="11" fill="#8b949e">si el proceso muere a mitad, el fichero</text>
  <text x="536" y="334" font-size="11" fill="#8b949e">bueno sigue intacto.</text>

  <text x="420" y="382" text-anchor="middle" font-size="12" fill="#8b949e">Perezoso vs materializado: File.ReadLines / EnumerateFiles recorren; File.ReadAllLines / GetFiles cargan todo en memoria.</text>
  <text x="420" y="410" text-anchor="middle" font-size="12" fill="#484f58">Cualquier capa puede lanzar IOException o UnauthorizedAccessException: File.Exists antes de abrir no garantiza nada (TOCTOU).</text>
</svg>
