<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Solución, proyectos y referencias</title>
  <desc id="desc">Una solución Shop.slnx agrupa tres proyectos: Shop.Cli (consola), Shop.Domain (librería) y Shop.Domain.Tests (xUnit). Cli y Tests referencian a Domain. Cada proyecto tiene su csproj, sus archivos .cs y las carpetas bin y obj generadas.</desc>
  <rect width="800" height="400" rx="12" fill="#0d1117"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Solución con varios proyectos</text>
  <!-- Solución -->
  <rect x="40" y="60" width="720" height="300" rx="12" fill="#161b22" stroke="#7a5cf0" stroke-width="2"/>
  <text x="60" y="88" font-size="14" font-weight="700" fill="#7a5cf0">Shop.slnx</text>
  <text x="140" y="88" font-size="11" fill="#8b949e">dotnet new sln · dotnet sln add · dotnet build compila todo</text>
  <!-- Proyecto Cli -->
  <g font-size="12">
    <rect x="60" y="110" width="200" height="150" rx="10" fill="#21262d" stroke="#6e7681"/>
    <text x="160" y="134" text-anchor="middle" font-weight="700" fill="#f0f6fc">Shop.Cli</text>
    <text x="160" y="152" text-anchor="middle" fill="#8b949e">OutputType = Exe</text>
    <text x="76" y="180" fill="#f0f6fc">Shop.Cli.csproj</text>
    <text x="76" y="200" fill="#f0f6fc">Program.cs</text>
    <text x="76" y="220" fill="#484f58">bin/  obj/  (generados)</text>
    <text x="76" y="244" fill="#7a5cf0">ProjectReference → Domain</text>
    <!-- Proyecto Tests -->
    <rect x="540" y="110" width="200" height="150" rx="10" fill="#21262d" stroke="#6e7681"/>
    <text x="640" y="134" text-anchor="middle" font-weight="700" fill="#f0f6fc">Shop.Domain.Tests</text>
    <text x="640" y="152" text-anchor="middle" fill="#8b949e">xunit · dotnet test</text>
    <text x="556" y="180" fill="#f0f6fc">Shop.Domain.Tests.csproj</text>
    <text x="556" y="200" fill="#f0f6fc">ProductTests.cs</text>
    <text x="556" y="220" fill="#484f58">bin/  obj/  (generados)</text>
    <text x="556" y="244" fill="#7a5cf0">ProjectReference → Domain</text>
    <!-- Proyecto Domain -->
    <rect x="300" y="200" width="200" height="150" rx="10" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="400" y="224" text-anchor="middle" font-weight="700" fill="#f0f6fc">Shop.Domain</text>
    <text x="400" y="242" text-anchor="middle" fill="#c9b8ff">OutputType = Library (.dll)</text>
    <text x="316" y="270" fill="#f0f6fc">Shop.Domain.csproj</text>
    <text x="316" y="290" fill="#f0f6fc">Product.cs · Order.cs</text>
    <text x="316" y="310" fill="#c9b8ff">PackageReference (NuGet)</text>
    <text x="316" y="334" fill="#c9b8ff">sin dependencias de UI ni I/O</text>
  </g>
  <line x1="200" y1="260" x2="330" y2="300" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="260" x2="470" y2="300" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#484f58">Regla: la librería de dominio no referencia a nadie; los demás la referencian a ella</text>
</svg>
