<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Flujo de control: condicional y bucles</title>
  <desc id="desc">Izquierda: diagrama de flujo de un if-else con condición booleana y dos ramas. Centro: bucle while, que evalúa la condición antes de cada iteración. Derecha: bucle do-while, que ejecuta el cuerpo y luego evalúa; se ejecuta al menos una vez. Se indican break y continue.</desc>
  <rect width="800" height="400" rx="12" fill="#0d1117"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Condicional y bucles</text>
  <g font-size="12" fill="#f0f6fc" text-anchor="middle">
    <!-- if / else -->
    <text x="140" y="66" font-weight="700" fill="#8b949e">if / else</text>
    <polygon points="140,84 210,124 140,164 70,124" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="140" y="129">cond : bool</text>
    <line x1="70" y1="124" x2="40" y2="124" stroke="#7a5cf0" stroke-width="2"/><line x1="40" y1="124" x2="40" y2="200" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="52" y="116" fill="#3fb950" font-size="11">true</text>
    <line x1="210" y1="124" x2="240" y2="124" stroke="#7a5cf0" stroke-width="2"/><line x1="240" y1="124" x2="240" y2="200" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="226" y="116" fill="#f85149" font-size="11">false</text>
    <rect x="10" y="202" width="90" height="40" rx="8" fill="#21262d" stroke="#6e7681"/><text x="55" y="227">bloque if</text>
    <rect x="180" y="202" width="90" height="40" rx="8" fill="#21262d" stroke="#6e7681"/><text x="225" y="227">bloque else</text>
    <line x1="55" y1="242" x2="55" y2="270" stroke="#7a5cf0" stroke-width="2"/><line x1="225" y1="242" x2="225" y2="270" stroke="#7a5cf0" stroke-width="2"/>
    <line x1="55" y1="270" x2="225" y2="270" stroke="#7a5cf0" stroke-width="2"/>
    <line x1="140" y1="270" x2="140" y2="300" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="322" fill="#8b949e">continúa</text>
    <!-- while -->
    <text x="420" y="66" font-weight="700" fill="#8b949e">while (cond)</text>
    <polygon points="420,84 490,124 420,164 350,124" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="420" y="129">cond</text>
    <line x1="420" y1="164" x2="420" y2="200" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="440" y="186" fill="#3fb950" font-size="11">true</text>
    <rect x="370" y="202" width="100" height="40" rx="8" fill="#21262d" stroke="#6e7681"/><text x="420" y="227">cuerpo</text>
    <line x1="470" y1="222" x2="520" y2="222" stroke="#7a5cf0" stroke-width="2"/><line x1="520" y1="222" x2="520" y2="124" stroke="#7a5cf0" stroke-width="2"/><line x1="520" y1="124" x2="492" y2="124" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="124" x2="310" y2="124" stroke="#7a5cf0" stroke-width="2"/><line x1="310" y1="124" x2="310" y2="300" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="330" y="116" fill="#f85149" font-size="11">false</text>
    <text x="310" y="322" fill="#8b949e">sale</text>
    <text x="420" y="270" fill="#8b949e" font-size="11">puede no ejecutarse nunca</text>
    <!-- do while -->
    <text x="680" y="66" font-weight="700" fill="#8b949e">do { } while (cond)</text>
    <rect x="630" y="84" width="100" height="40" rx="8" fill="#21262d" stroke="#6e7681"/><text x="680" y="109">cuerpo</text>
    <line x1="680" y1="124" x2="680" y2="160" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="680,162 750,202 680,242 610,202" fill="#3f21a6" stroke="#7a5cf0"/>
    <text x="680" y="207">cond</text>
    <line x1="750" y1="202" x2="780" y2="202" stroke="#7a5cf0" stroke-width="2"/><line x1="780" y1="202" x2="780" y2="104" stroke="#7a5cf0" stroke-width="2"/><line x1="780" y1="104" x2="732" y2="104" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="764" y="194" fill="#3fb950" font-size="11">true</text>
    <line x1="680" y1="242" x2="680" y2="300" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="700" y="266" fill="#f85149" font-size="11">false</text>
    <text x="680" y="322" fill="#8b949e">sale · se ejecuta ≥ 1 vez</text>
  </g>
  <g font-size="11">
    <text x="40" y="366" fill="#d29922" font-weight="700">break</text><text x="78" y="366" fill="#8b949e">: sale del bucle más interno</text>
    <text x="300" y="366" fill="#58a6ff" font-weight="700">continue</text><text x="354" y="366" fill="#8b949e">: salta a la siguiente evaluación de cond</text>
    <text x="620" y="366" fill="#3fb950" font-weight="700">return</text><text x="661" y="366" fill="#8b949e">: sale del método</text>
  </g>
</svg>
