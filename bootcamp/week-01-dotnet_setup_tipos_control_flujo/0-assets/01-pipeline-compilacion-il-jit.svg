<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Pipeline de compilación de C#</title>
  <desc id="desc">Código fuente C# compilado por Roslyn a IL dentro de un assembly; en ejecución el CLR carga el assembly y el JIT traduce cada método a código nativo la primera vez que se llama; el GC gestiona la memoria.</desc>
  <rect width="800" height="360" rx="12" fill="#0d1117"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">De .cs a código nativo</text>
  <!-- Fase compilación -->
  <rect x="30" y="60" width="350" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="82" font-size="11" font-weight="700" letter-spacing="1" fill="#8b949e">TIEMPO DE COMPILACIÓN · dotnet build</text>
  <rect x="50" y="100" width="90" height="56" rx="8" fill="#21262d" stroke="#6e7681"/>
  <text x="95" y="125" text-anchor="middle" font-size="13" fill="#f0f6fc">Program.cs</text>
  <text x="95" y="143" text-anchor="middle" font-size="11" fill="#8b949e">código C#</text>
  <line x1="140" y1="128" x2="170" y2="128" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="172" y="100" width="90" height="56" rx="8" fill="#3f21a6" stroke="#7a5cf0"/>
  <text x="217" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">Roslyn</text>
  <text x="217" y="143" text-anchor="middle" font-size="11" fill="#c9b8ff">compilador csc</text>
  <line x1="262" y1="128" x2="292" y2="128" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="100" width="80" height="56" rx="8" fill="#21262d" stroke="#6e7681"/>
  <text x="330" y="125" text-anchor="middle" font-size="13" fill="#f0f6fc">App.dll</text>
  <text x="330" y="143" text-anchor="middle" font-size="10" fill="#8b949e">IL + metadatos</text>
  <!-- Flecha entre fases -->
  <line x1="380" y1="128" x2="420" y2="128" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Fase ejecución -->
  <rect x="420" y="60" width="350" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="436" y="82" font-size="11" font-weight="700" letter-spacing="1" fill="#8b949e">TIEMPO DE EJECUCIÓN · dotnet App.dll</text>
  <rect x="440" y="100" width="90" height="56" rx="8" fill="#3f21a6" stroke="#7a5cf0"/>
  <text x="485" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">CLR</text>
  <text x="485" y="143" text-anchor="middle" font-size="11" fill="#c9b8ff">carga assembly</text>
  <line x1="530" y1="128" x2="560" y2="128" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="562" y="100" width="90" height="56" rx="8" fill="#3f21a6" stroke="#7a5cf0"/>
  <text x="607" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">JIT</text>
  <text x="607" y="143" text-anchor="middle" font-size="11" fill="#c9b8ff">por método, 1ª llamada</text>
  <line x1="652" y1="128" x2="682" y2="128" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="684" y="100" width="70" height="56" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="719" y="125" text-anchor="middle" font-size="13" fill="#f0f6fc">x64 / ARM</text>
  <text x="719" y="143" text-anchor="middle" font-size="11" fill="#3fb950">nativo</text>
  <!-- Notas inferiores -->
  <rect x="30" y="210" width="230" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="145" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">IL (Intermediate Language)</text>
  <text x="145" y="260" text-anchor="middle" font-size="11" fill="#8b949e">independiente de CPU y SO</text>
  <text x="145" y="280" text-anchor="middle" font-size="11" fill="#8b949e">el mismo .dll corre en Linux,</text>
  <text x="145" y="298" text-anchor="middle" font-size="11" fill="#8b949e">Windows, macOS, x64 y ARM</text>
  <rect x="285" y="210" width="230" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">JIT tiered</text>
  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#8b949e">Tier 0: compila rápido, poco optimizado</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#8b949e">Tier 1: recompila métodos calientes</text>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#8b949e">con optimización completa</text>
  <rect x="540" y="210" width="230" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="655" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">GC (Garbage Collector)</text>
  <text x="655" y="260" text-anchor="middle" font-size="11" fill="#8b949e">libera objetos sin referencias</text>
  <text x="655" y="280" text-anchor="middle" font-size="11" fill="#8b949e">automático, generacional</text>
  <text x="655" y="298" text-anchor="middle" font-size="11" fill="#8b949e">detalle en semana 11</text>
</svg>
