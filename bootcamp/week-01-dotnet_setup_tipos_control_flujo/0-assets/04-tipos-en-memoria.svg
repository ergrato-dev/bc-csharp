<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,sans-serif">
  <title id="title">Tipos primitivos y su tamaño en memoria</title>
  <desc id="desc">Barras proporcionales al tamaño en bits de cada tipo primitivo: byte 8, short y char 16, int y float 32, long y double 64, decimal 128. Debajo, comparación entre tipo por valor (la variable contiene el dato en el stack) y tipo por referencia (la variable contiene una dirección a un objeto en el heap).</desc>
  <rect width="800" height="420" rx="12" fill="#0d1117"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7a5cf0"/></marker></defs>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f6fc">Tamaño de los tipos primitivos</text>
  <g font-size="12" fill="#f0f6fc">
    <text x="40" y="70">byte</text>      <rect x="120" y="58" width="32" height="16" rx="3" fill="#33247a"/>  <text x="160" y="70" fill="#8b949e">8 bits · 0..255</text>
    <text x="40" y="98">short · char</text><rect x="120" y="86" width="64" height="16" rx="3" fill="#3f21a6"/> <text x="192" y="98" fill="#8b949e">16 bits</text>
    <text x="40" y="126">int · float</text><rect x="120" y="114" width="128" height="16" rx="3" fill="#512BD4"/><text x="256" y="126" fill="#8b949e">32 bits · int: ±2,1 × 10⁹ · entero por defecto</text>
    <text x="40" y="154">long · double</text><rect x="120" y="142" width="256" height="16" rx="3" fill="#6a48e6"/><text x="384" y="154" fill="#8b949e">64 bits · double: real por defecto</text>
    <text x="40" y="182">decimal</text>   <rect x="120" y="170" width="512" height="16" rx="3" fill="#9b84f6"/><text x="640" y="182" fill="#8b949e">128 bits · dinero</text>
    <text x="40" y="210">bool</text>      <rect x="120" y="198" width="32" height="16" rx="3" fill="#21262d" stroke="#6e7681"/><text x="160" y="210" fill="#8b949e">1 byte en memoria, solo true/false</text>
  </g>
  <!-- Valor vs referencia -->
  <text x="400" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Valor vs referencia</text>
  <g font-size="12">
    <rect x="40" y="272" width="340" height="128" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="296" font-weight="700" fill="#3fb950">Tipo por valor · int a = 1; int b = a;</text>
    <rect x="60" y="312" width="90" height="36" rx="6" fill="#21262d" stroke="#6e7681"/><text x="105" y="335" text-anchor="middle" fill="#f0f6fc">a = 1</text>
    <rect x="170" y="312" width="90" height="36" rx="6" fill="#21262d" stroke="#6e7681"/><text x="215" y="335" text-anchor="middle" fill="#f0f6fc">b = 1</text>
    <text x="60" y="372" fill="#8b949e">dos copias independientes en el stack</text>
    <text x="60" y="390" fill="#8b949e">b = 2 no afecta a a</text>
    <rect x="420" y="272" width="340" height="128" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="440" y="296" font-weight="700" fill="#d29922">Tipo por referencia · int[] xs = [1,2]; var ys = xs;</text>
    <rect x="440" y="312" width="60" height="36" rx="6" fill="#21262d" stroke="#6e7681"/><text x="470" y="335" text-anchor="middle" fill="#f0f6fc">xs</text>
    <rect x="440" y="356" width="60" height="36" rx="6" fill="#21262d" stroke="#6e7681"/><text x="470" y="379" text-anchor="middle" fill="#f0f6fc">ys</text>
    <rect x="620" y="330" width="120" height="44" rx="6" fill="#3f21a6" stroke="#7a5cf0"/><text x="680" y="356" text-anchor="middle" fill="#f0f6fc">[ 1 , 2 ]  heap</text>
    <line x1="500" y1="330" x2="618" y2="348" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="374" x2="618" y2="356" stroke="#7a5cf0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="520" y="396" fill="#8b949e">ys[0] = 9 también cambia xs[0]</text>
  </g>
</svg>
